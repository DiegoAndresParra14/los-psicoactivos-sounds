<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/cart/cart.css">
    <link rel="stylesheet" href="./css/cart/components-cart.css">
    <link rel="stylesheet" href="/css/MAINnn/main.css">
    <link rel="stylesheet" href="./css/cart/layout-cart.css">
    <title>Carrito</title>
</head>
<body>

    <header class="header">
        <div class="cart-header-logo">
            <a href="/index.html"><img src="./assets/img/icons/logo1.png" alt="Logo" class="cart-img-logo"></a>
            <a href="/index.html">MusicStream</a>
        </div>
        <nav class="cart-header-nav">
            <a href="index.html">Home</a>
            <a href="index.html">Discover</a>
            <a href="index.html">Library</a>
            <a href="index.html">Store</a>
           <a href="/index.html"><button class="cart-btn-cart"><i class="fa-solid fa-cart-arrow-down"></i></button></a>
            <img src="./assets/img/porfile.jpg" alt="Profile" class="header-icono-porfile">
        </nav>
    </header>

    <main class="main-wrapper">

        <div class="main-options">Store / <strong>Your Cart</strong></div>
        <h1 class="main-title">Your Cart</h1>

        <section class="main-layout">

            
            <section class="main-items-list">

                <div class="main-item">
                    <img src="./assets/img/Serenata Sin Mariachis.jpg" alt="Currents" class="main-item-img">
                    <div class="main-item-info">
                        <span class="main-item-title">Serenata Sin Marichis</span>
                        <span class="main-item-artist">Doble Porción</span>
                        <span class="main-item-artist">FLAC</span>
                    </div>
                    <div class="main-item-controls">
                        <button>-</button>
                        <span class="main-item-number">1</span>
                        <button>+</button>
                    </div>
                    <span class="main-item-price">$12.99</span>
                    <a class="main-item-delete" href="#"><i class="fa-regular fa-trash-can"></i></a>
                </div>

                <div class="main-item">
                    <img src="./assets/img/wili colon.jpg" alt="Willie" class="main-item-img">
                    <div class="main-item-info">
                        <span class="main-item-title">Greatest Hits</span>
                        <span class="main-item-artist">Willie Colón</span>
                        <span class="main-item-artist">Digital MP3</span>
                    </div>
                    <div class="main-item-controls">
                        <button>-</button>
                        <span class="main-item-number">1</span>
                        <button>+</button>
                    </div>
                    <span class="main-item-price">$15.99</span>
                    <a class="main-item-delete" href="#"><i class="fa-regular fa-trash-can"></i> </a>
                </div>

            </section>

            
            <section class="main-order-summary">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>$28.98</span>
                </div>
                <div class="summary-row">
                    <span>Estimated Tax</span>
                    <span>$1.02</span>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span>$30</span>
                </div>
                <a href="checkout.html"><button class="main-order-button"><i class="fa-solid fa-lock"></i> Proceed to Checkout</button></a>
                <a class="summary-link" href="index.html">Continue Shopping</a>
            </section>

        </section>
    </main>

</body>
</html>
