<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Carrito</title>
</head>
    <header class="header">
        <img src="./logo1.png" alt="Error" class="header-img">
        <div class="header-content"><a href="#">MusicStream</a></div>
        <a href="#" class="header-a">Home</a>
        <a href="#" class="header-a">Discover</a>
        <a href="#" class="header-a">Library</a>
        <a href="#" class="header-a">Store</a>
        <button  class="header-aa">🛒</button>
        <span class="header-avatar"></span>
    </header>

    <main>
        <div class="main-options"> Store / Your Cart </div>
        <h1 class="main-title">YourCart</h1>
        <div class="main-items">
            <img src="./sun.png" alt="error" class="main-items-img">
            
            <h5 class="main-items-text">Currents</h5>
            <span class="main-items-text">Tame Impala</span>
            <span class="main-items-text">FLAC</span>
            <button>-</button>
            <p>1</p>
            <button>+</button>
            <p>$12.99 </p>
            <a class="main-emoji" href="#">🗑️</a>
        </div>
        <div class="main-items">
            <img src="./Lost in Sound.jpg" alt="Error" class="main-items-img">
            <h5 class="main-items-text">Blonde</h5>
            <span class="main-items-text">Frank Ocean</span>
            <span class="main-items-text">Digital MP3</span>
            <button>-</button>
            <p>1</p>
            <button>+</button>
            <p>$9.99</p>
            <a href="#">🗑️</a>
        </div>

        <div class="main-order-summary">
         <h2> OrderSummary</h2>
         <span>Subtotal</span>
         <p class="main-order">$22.98</p>
         <span>Estimated Tax</span>
         <p class="main-order">1.84</p>
         <h3>Total</h3>
         <p class="main-order">$24.82</p>
         <button class="main-order-button">🔒 Procced to Checkout</button>
         <a href="#">Continue Shopping</a>
        </div>
    </main>

</body>
</html>
