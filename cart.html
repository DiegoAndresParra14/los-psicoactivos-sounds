<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/views/cart.css">
    <title>Carrito</title>
</head>
<body>

    <header class="header">
        <div class="cart-header-logo">
            <img src="./assets/img/icons/logo1.png" alt="Logo" class="cart-img-logo">
            <a href="#">MusicStream</a>
        </div>
        <nav class="cart-header-nav">
            <a href="#">Home</a>
            <a href="#">Discover</a>
            <a href="#">Library</a>
            <a href="#">Store</a>
            <button class="cart-btn-cart"><i class="fa-solid fa-cart-arrow-down"></i></button>
            <img src="./assets/img/porfile.jpg" alt="Profile" class="header-icono-porfile">
        </nav>
    </header>

    <main class="main-wrapper">

        <div class="main-options">Store / <strong>Your Cart</strong></div>
        <h1 class="main-title">Your Cart</h1>

        <div class="main-layout">

            
            <div class="main-items-list">

                <div class="main-item">
                    <img src="./assets/img/sun.png" alt="Currents" class="main-item-img">
                    <div class="main-item-info">
                        <span class="main-item-title">Currents</span>
                        <span class="main-item-artist">Tame Impala</span>
                        <span class="main-item-artist">FLAC</span>
                    </div>
                    <div class="main-item-controls">
                        <button>-</button>
                        <span class="main-item-number">1</span>
                        <button>+</button>
                    </div>
                    <span class="main-item-price">$12.99</span>
                    <a class="main-item-delete" href="#"><i class="fa-regular fa-trash-can"></i></a>
                </div>

                <div class="main-item">
                    <img src="./assets/img/Lost_in_Sound.webp" alt="Blonde" class="main-item-img">
                    <div class="main-item-info">
                        <span class="main-item-title">Blonde</span>
                        <span class="main-item-artist">Frank Ocean</span>
                        <span class="main-item-format">Digital MP3</span>
                    </div>
                    <div class="main-item-controls">
                        <button>-</button>
                        <span class="main-item-number">1</span>
                        <button>+</button>
                    </div>
                    <span class="main-item-price">$9.99</span>
                    <a class="main-item-delete" href="#"><i class="fa-regular fa-trash-can"></i> </a>
                </div>

            </div>

            
            <div class="main-order-summary">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>$22.98</span>
                </div>
                <div class="summary-row">
                    <span>Estimated Tax</span>
                    <span>$1.84</span>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span>$24.82</span>
                </div>
                <button class="main-order-button"><i class="fa-solid fa-lock"></i> Proceed to Checkout</button>
                <a class="summary-link" href="#">Continue Shopping</a>
            </div>

        </div>
    </main>

</body>
</html>
