<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/player/components-player.css">
    <link rel="stylesheet" href="/css/player/player.css">
    <link rel="stylesheet" href="/css/MAIN/main.css">
     <link rel="stylesheet" href="/css/player/layout-player.css">

    <title>Reproductor Inmersivo</title>
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <a href="/index.html"><img src="/assets/img/icons/logo1.png" alt="Error" class="player-img-logo"></a>
            <a href="/index.html">MusicStream</a>
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search" class="header-input">
        </div>
         <nav class="header-nav">
            <a href="/index.html">Home</a>
            <a href="/index.html">Discover</a>
            <a href="/index.html">Library</a>
            <a href="/index.html">Store</a>
            <a href="/index.html">✉</a>
            <img src="/assets/img/porfile.jpg" alt="Error" class="header-icono-porfile">
        </nav>
     </header>

     <main class="player">

        <section class="player-left">                         
            <div class="player-content">
                <div class="player-album">
                    <img src="/assets/img/GNcaliP.jpg" alt="Album">
                </div>
            </div>

            <div class="player-info">                     
                <h1 class="player-title">Cali Pachanguero</h1>
                <p class="player-artist"> Grupo Niche</p>
                <p class="player-genre"> Salsa</p>
                <a href="/cart.html" ><button class="button-track"><i class="fa-solid fa-cart-shopping"></i> Buy Track </button></a>
            </div>        
        </section>

        <aside class="player-aside">
            <h2 class="aside-title">Up Next</h2>
            <ul class="aside-list">
                
                <li class="aside-item">
                    <img src="/assets/img/grupo niche.jpg" alt="Error" class="aside-text-img">
                    <div class="aside-text">
                        <span>Hagamos Lo que Diga el Corazon</span>
                        <span>Grupo Niche</span>
                    </div>
                    <span class="aside-time">5:06</span>
                </li>
                <li class="aside-item">
                    <img src="/assets/img/grupo niche.jpg" alt="" class="aside-text-img">
                    <div class="aside-text">
                        <span>Una Aventura</span>
                        <span>Grupo Niche</span>
                    </div>
                    <span class="aside-time">5:24</span>
                </li>
                <li class="aside-item">
                    <img src="/assets/img/grupo niche.jpg" alt="Error" class="aside-text-img">
                    <div class="aside-text">                      
                        <span> Mi pueblo</span>
                        <span>Grupo Niche</span>
                    </div>
                    <span class="aside-time">5:24</span>
                </li>
            </ul>
        </aside>

    </main>

    <footer class="player-bar">
    <div class="player-bar-left">
        <img src="/assets/img/GNcaliP.jpg" alt="Error" class="player-bar-img">
        <div>
            <div class="player-bar-text">Cali Pachanguero</div>
            <span class="player-bar-subtext">Grupo Niche</span>
        </div>
        <button class="player-bar-btn"><i class="fa-regular fa-heart"></i></button>
    </div>

    <section class="player-bar-center">
        <div class="player-bar-controls">
            <button class="player-bar-btn"><i class="fa-solid fa-shuffle"></i></button>
            <button class="player-bar-btn"><i class="fa-solid fa-backward-step"></i></button>
            <button class="player-bar-btn-play"><i class="fa-solid fa-pause"></i></button>
            <button class="player-bar-btn"><i class="fa-solid fa-forward-step"></i></button>
            <button class="player-bar-btn"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="player-bar-progress">
            <div class="player-bar-track">
                <div class="player-bar-fill"></div>
            </div>
        </div>
    </section>

    <section class="player-bar-right">
        <span class="player-bar-btn">1:21 / 3:56</span>
        <button class="player-bar-btn"><i class="fa-solid fa-volume-high"></i></button>
        <div class="player-volume-track">
            <div class="player-volume-fill"></div>
            <div class="player-volume-thumb"></div> 
        </div>
        <button class="player-bar-btn"><i class="fa-solid fa-expand"></i></button>
    </section>
</footer>

</body>
</html>
